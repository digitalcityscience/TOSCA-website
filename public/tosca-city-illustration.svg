<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">TOSCA — evolving urban connections</title>
<desc id="desc">Minimal isometric city map with progressively taller buildings and a subtle dotted connection line.</desc>
<defs>
  <style><![CDATA[
    .edge{stroke:#285949;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
    .fine{stroke:#87a994;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
    .road{stroke:#fffdf5;stroke-width:18;fill:none;stroke-linecap:round}
    .lane{stroke:#abc3ac;stroke-width:1.4;stroke-dasharray:6 8;fill:none}
    .connect{stroke:#e9794f;stroke-width:2.7;stroke-dasharray:7 7;fill:none;stroke-linecap:round}
  ]]></style>
  <radialGradient id="paper"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f7f7ed"/></radialGradient>
  <g id="tree"><path d="M0 0v26" stroke="#779984" stroke-width="2"/><circle cx="0" cy="-4" r="15" fill="#6b9275" stroke="#426e57" stroke-width="1.3"/><circle cx="-4" cy="-9" r="6" fill="#83a58a" opacity=".55"/></g>
  <g id="person"><circle cx="0" cy="0" r="26" fill="#dfe8d8"/><circle cy="-7" r="7.5" fill="#245543"/><path d="M-13 13q1-15 13-15t13 15z" fill="#245543"/></g>
</defs>
<rect width="1400" height="850" fill="url(#paper)"/>
<!-- isometric urban ground plane -->
<polygon points="42,524 909,110 1360,374 491,793" fill="#eef2e7" class="edge"/>
<!-- property parcels: deliberately subtle -->
<g fill="#dfe8d8" opacity=".85">
<polygon points="126,510 267,444 355,496 215,562"/>
<polygon points="296,424 442,355 521,402 374,473"/>
<polygon points="481,337 626,268 709,316 562,385"/>
<polygon points="666,249 803,184 884,233 745,299"/>
<polygon points="322,577 467,506 550,555 407,626"/>
<polygon points="535,472 680,400 765,452 620,521"/>
<polygon points="762,369 894,305 974,354 837,420"/>
<polygon points="946,278 1084,211 1168,258 1025,327"/>
<polygon points="864,493 1021,419 1110,470 951,544"/>
<polygon points="1069,390 1194,331 1278,380 1148,441"/>
</g>
<!-- street network on surface -->
<g class="road" opacity=".93">
<path d="M174 462 588 700"/><path d="M408 349 820 584"/><path d="M643 235 1054 471"/><path d="M874 126 1284 362"/>
<path d="M353 703 1241 286"/>
</g>
<g class="lane" opacity=".7">
<path d="M174 462 588 700"/><path d="M408 349 820 584"/><path d="M643 235 1054 471"/><path d="M874 126 1284 362"/>
<path d="M353 703 1241 286"/>
</g>
<!-- featured avenue: the orange dashed connection lives on the ground, as a street marking, arriving at a building entrance -->
<path d="M195 615 775 341" stroke="#fffdf5" stroke-width="20" fill="none" stroke-linecap="round" opacity=".95"/>
<path d="M195 615 775 341 Q800 390 817 453" stroke="#e5794f" stroke-width="2.4" stroke-dasharray="3 10" fill="none" stroke-linecap="round" opacity=".85"/>
<!-- park and pond -->
<polygon points="816,515 972,442 1066,496 910,568" fill="#c6d6bd" opacity=".65"/>
<path d="M888 521q31-20 54-7 19 11 43-8 22-16 48-6" stroke="#96b7a9" fill="none" stroke-width="4" stroke-linecap="round" opacity=".8"/>
<!-- isometric building helper: hand drawn explicit faces -->
<!-- small early structures -->
<g class="edge">
<polygon points="231,535 262,520 294,539 262,554" fill="#f3b78f"/>
<polygon points="231,535 262,554 262,602 231,584" fill="#ec8f57"/>
<polygon points="262,554 294,539 294,588 262,602" fill="#d97340"/>
<polygon points="371,486 410,468 451,493 412,511" fill="#f9f9f0"/>
<polygon points="371,486 412,511 412,541 371,519" fill="#eaf1e8"/>
<polygon points="412,511 451,493 451,524 412,541" fill="#c1d1bb"/>
<polygon points="533,418 574,399 617,425 575,444" fill="#dcebd4"/>
<polygon points="533,418 575,444 575,523 533,499" fill="#a9c9a0"/>
<polygon points="575,444 617,425 617,502 575,523" fill="#7ea873"/>
<polygon points="677,365 715,346 758,372 720,391" fill="#f9faf0"/>
<polygon points="677,365 720,391 720,478 677,452" fill="#e6eee2"/>
<polygon points="720,391 758,372 758,454 720,478" fill="#b8cbb1"/>
<polygon points="817,311 854,292 897,317 860,336" fill="#f3b78f"/>
<polygon points="817,311 860,336 860,478 817,453" fill="#ec8f57"/>
<polygon points="860,336 897,317 897,456 860,478" fill="#d97340"/>
<polygon points="973,287 1011,266 1051,291 1013,312" fill="#dcebd4"/>
<polygon points="973,287 1013,312 1013,414 973,391" fill="#a9c9a0"/>
<polygon points="1013,312 1051,291 1051,392 1013,414" fill="#7ea873"/>
<!-- tallest skyline landmark -->
<polygon points="1067,214 1116,189 1163,216 1115,241" fill="#fbfbf2"/>
<polygon points="1067,214 1115,241 1115,439 1067,411" fill="#f0f3e9"/>
<polygon points="1115,241 1163,216 1163,413 1115,439" fill="#b6ceb4"/>
<polygon points="1173,277 1206,260 1244,283 1211,302" fill="#dcebd4"/>
<polygon points="1173,277 1211,302 1211,420 1173,399" fill="#a9c9a0"/>
<polygon points="1211,302 1244,283 1244,398 1211,420" fill="#7ea873"/>
<polygon points="1254,354 1296,333 1334,354 1293,376" fill="#f7f9ed"/>
<polygon points="1254,354 1293,376 1293,428 1254,405" fill="#e9efe5"/>
<polygon points="1293,376 1334,354 1334,408 1293,428" fill="#a9c3aa"/>
</g>
<!-- facade details -->
<g stroke="#376a56" stroke-width="2" stroke-linecap="round" opacity=".8">
<path d="M691 410v9m15 0v9m-15 12v8m29-31v9m111-69v12m15-4v11m-15 14v10m15-3v12m-15 14v10m15-4v10m136-94v10m16-5v10m-16 14v10m16-5v10m-16 15v10"/>
<path d="M1082 267v12m17-5v12m-17 18v12m17-5v12m-17 18v12m17-5v12m-17 18v12m17-6v12"/>
<path d="M1184 323v10m16-5v10m-16 17v10m16-6v10"/>
</g>
<!-- waypoints along the featured avenue, where people meet the route -->
<g fill="#e5794f" stroke="#fff9f1" stroke-width="2.5">
<circle cx="195" cy="615" r="7"/>
<circle cx="410" cy="513" r="5"/>
<circle cx="817" cy="453" r="6"/>
</g>
<!-- trees -->
<g>
<use href="#tree" transform="translate(157 550) scale(.92)"/>
<use href="#tree" transform="translate(327 483) scale(1.05)"/>
<use href="#tree" transform="translate(344 465) scale(.75)"/>
<use href="#tree" transform="translate(505 529) scale(.9)"/>
<use href="#tree" transform="translate(638 393) scale(.87)"/>
<use href="#tree" transform="translate(662 412) scale(.65)"/>
<use href="#tree" transform="translate(790 442) scale(.85)"/>
<use href="#tree" transform="translate(797 422) scale(.65)"/>
<use href="#tree" transform="translate(930 256) scale(.8)"/>
<use href="#tree" transform="translate(952 275) scale(.67)"/>
<use href="#tree" transform="translate(1037 471) scale(.9)"/>
<use href="#tree" transform="translate(1215 447) scale(.79)"/>
<use href="#tree" transform="translate(1278 317) scale(.78)"/>
</g>
<!-- a second dashed connection, linking the two people along the street grid -->
<path d="M300 650 L500 760 Q650 700 905 578" stroke="#e5794f" stroke-width="2.2" stroke-dasharray="3 9" fill="none" stroke-linecap="round" opacity=".8"/>
<g fill="#e5794f" stroke="#fff9f1" stroke-width="2.5"><circle cx="300" cy="650" r="4.5"/><circle cx="905" cy="578" r="4.5"/></g>
<!-- people, standing on the ground along the route -->
<use href="#person" transform="translate(300 638) scale(.85)"/>
<use href="#person" transform="translate(905 560) scale(.8)"/>
<!-- a short drone hop between two neighbouring rooftops, instead of a long aerial arc -->
<path d="M1116 189 Q1161 160 1206 260" stroke="#9fb79b" stroke-width="1.6" stroke-dasharray="2 7" fill="none" stroke-linecap="round" opacity=".8"/>
<circle cx="1116" cy="189" r="3" fill="#e5794f"/><circle cx="1206" cy="260" r="3" fill="#e5794f"/>
<g transform="translate(1161 165) scale(.85)" fill="none" stroke="#375c49" stroke-width="1.6" stroke-linecap="round">
<path d="M-14-8-4 0M14-8 4 0M-14 8-4 0M14 8 4 0"/>
<circle cx="-14" cy="-8" r="4"/><circle cx="14" cy="-8" r="4"/><circle cx="-14" cy="8" r="4"/><circle cx="14" cy="8" r="4"/>
<rect x="-7" y="-5" width="14" height="10" rx="3" fill="#e5794f"/>
</g>
</svg>
